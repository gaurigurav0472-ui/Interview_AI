{% extends "base.html" %}
{% block title %}Register — InterviewAI{% endblock %}

{% block content %}
<div class="row justify-content-center mt-3">
    <div class="col-md-5 col-lg-4">

        <!-- Logo -->
        <div class="text-center mb-4 animate__animated animate__fadeInDown">
            <div style="font-size:3rem;">🤖</div>
            <h2 class="fw-bold mt-2" style="background:linear-gradient(135deg,#6c63ff,#f50057);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">
                InterviewAI
            </h2>
            <p style="color:#8888aa;">Create your free account</p>
        </div>

        <!-- Register Card -->
        <div class="glass-card animate__animated animate__fadeInUp">
            <h4 class="fw-bold mb-4 text-center">
                <i class="fas fa-user-plus me-2" style="color:#6c63ff;"></i>Create Account
            </h4>

            <form method="POST" action="/register">

                <!-- Name -->
                <div class="mb-3">
                    <label class="form-label" style="color:#ccc;">Full Name</label>
                    <div style="position:relative;">
                        <i class="fas fa-user" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#8888aa;"></i>
                        <input type="text" name="name" required placeholder="John Doe"
                               style="background:#12122a;border:2px solid rgba(108,99,255,0.25);color:#e0e0f0;border-radius:10px;padding:11px 14px 11px 40px;width:100%;font-size:0.95rem;transition:border-color 0.2s;"
                               onfocus="this.style.borderColor='#6c63ff'" onblur="this.style.borderColor='rgba(108,99,255,0.25)'"/>
                    </div>
                </div>

                <!-- Email -->
                <div class="mb-3">
                    <label class="form-label" style="color:#ccc;">Email Address</label>
                    <div style="position:relative;">
                        <i class="fas fa-envelope" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#8888aa;"></i>
                        <input type="email" name="email" required placeholder="you@example.com"
                               style="background:#12122a;border:2px solid rgba(108,99,255,0.25);color:#e0e0f0;border-radius:10px;padding:11px 14px 11px 40px;width:100%;font-size:0.95rem;transition:border-color 0.2s;"
                               onfocus="this.style.borderColor='#6c63ff'" onblur="this.style.borderColor='rgba(108,99,255,0.25)'"/>
                    </div>
                </div>

                <!-- Password -->
                <div class="mb-3">
                    <label class="form-label" style="color:#ccc;">Password</label>
                    <div style="position:relative;">
                        <i class="fas fa-lock" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#8888aa;"></i>
                        <input type="password" name="password" id="pwd" required placeholder="Min. 6 characters"
                               style="background:#12122a;border:2px solid rgba(108,99,255,0.25);color:#e0e0f0;border-radius:10px;padding:11px 40px 11px 40px;width:100%;font-size:0.95rem;transition:border-color 0.2s;"
                               onfocus="this.style.borderColor='#6c63ff'" onblur="this.style.borderColor='rgba(108,99,255,0.25)'"/>
                        <i class="fas fa-eye" id="toggle-pwd" onclick="togglePwd('pwd','toggle-pwd')"
                           style="position:absolute;right:14px;top:50%;transform:translateY(-50%);color:#8888aa;cursor:pointer;"></i>
                    </div>
                </div>

                <!-- Confirm Password -->
                <div class="mb-4">
                    <label class="form-label" style="color:#ccc;">Confirm Password</label>
                    <div style="position:relative;">
                        <i class="fas fa-lock" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#8888aa;"></i>
                        <input type="password" name="confirm" id="confirm" required placeholder="Repeat password"
                               style="background:#12122a;border:2px solid rgba(108,99,255,0.25);color:#e0e0f0;border-radius:10px;padding:11px 40px 11px 40px;width:100%;font-size:0.95rem;transition:border-color 0.2s;"
                               onfocus="this.style.borderColor='#6c63ff'" onblur="this.style.borderColor='rgba(108,99,255,0.25)'"/>
                        <i class="fas fa-eye" id="toggle-confirm" onclick="togglePwd('confirm','toggle-confirm')"
                           style="position:absolute;right:14px;top:50%;transform:translateY(-50%);color:#8888aa;cursor:pointer;"></i>
                    </div>
                    <small id="match-msg" style="font-size:0.82rem;"></small>
                </div>

                <button type="submit" class="btn btn-primary-custom w-100 mb-3">
                    <i class="fas fa-user-plus me-2"></i>Create Account
                </button>

            </form>

            <div class="text-center" style="color:#8888aa; font-size:0.9rem;">
                Already have an account?
                <a href="/login" style="color:#6c63ff; font-weight:600; text-decoration:none;">Login here</a>
            </div>
        </div>

    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function togglePwd(fieldId, iconId) {
    const field = document.getElementById(fieldId);
    const icon  = document.getElementById(iconId);
    if (field.type === 'password') {
        field.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
    } else {
        field.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
    }
}

// Live password match check
document.getElementById('confirm').addEventListener('input', function () {
    const pwd = document.getElementById('pwd').value;
    const msg = document.getElementById('match-msg');
    if (this.value === '') { msg.textContent = ''; return; }
    if (this.value === pwd) {
        msg.textContent = '✅ Passwords match';
        msg.style.color = '#10b981';
    } else {
        msg.textContent = '❌ Passwords do not match';
        msg.style.color = '#ef4444';
    }
});
</script>
{% endblock %}
